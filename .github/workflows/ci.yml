name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  backend-checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main') || startsWith(github.ref, 'refs/tags/')
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kapital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --frozen --directory backend

      - name: Run Ruff Lint & Format Checks
        run: |
          uv run --directory backend ruff check .
          uv run --directory backend ruff format --check .

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kapital_test
          JWT_SECRET_KEY: test_secret_key_for_backend_tests
        run: |
          uv run --directory backend pytest

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main') || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Verify Build
        run: npm run build --prefix frontend

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main') || startsWith(github.ref, 'refs/tags/')

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kapital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Install Backend dependencies
        run: uv sync --frozen --directory backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run database migrations and seed
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kapital_test
          JWT_SECRET_KEY: test_secret_key_for_playwright_e2e_runs
        run: |
          uv run --directory backend alembic upgrade head
          uv run --directory backend python -m src.seed_test_user

      - name: Run Playwright tests
        working-directory: frontend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kapital_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kapital_test
          JWT_SECRET_KEY: test_secret_key_for_playwright_e2e_runs
        run: |
          npx playwright test

  build-release-images:
    name: Build & Push Release Images
    runs-on: ubuntu-latest
    needs: [playwright-tests]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if an open PR already exists
          pr_list=$(gh pr list --head "${{ github.ref_name }}" --base main --state open --json number --jq '.[0].number')
          
          if [ -z "$pr_list" ]; then
            echo "Creating Pull Request..."
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "feat: ${{ github.ref_name }}" \
              --body "Automated PR created by GitHub Actions because all tests passed. Please review and merge manually."
          else
            echo "PR #$pr_list already exists."
          fi
