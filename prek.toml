# Repo-wide quality hooks.
# Python-specific tools (ruff, ty, validate-pyproject) are scoped to
# backend/ so they never run against frontend TS/Vue files.

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.12"
[[repos.hooks]]
id = "ruff"
args = ["--fix"]
files = "^backend/"
[[repos.hooks]]
id = "ruff-format"
files = "^backend/"

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "v0.25"
[[repos.hooks]]
id = "validate-pyproject"
files = "^backend/"

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.16.0"
[[repos.hooks]]
id = "commitizen"
stages = ["commit-msg"]
