[project]
name = "kapital"
version = "0.1.0"
description = "Wealth management and analysis."
readme = "../README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "marimo>=0.23.5",
    "polars>=1.40.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.29",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "alembic>=1.13.1",
    "factory-boy>=3.3.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "D",       # Missing docstrings
    "E731",    # Allow lambda expressions (readability over function definitions)
    "PLR0913", # Allow functions with 5+ parameters
    "RET504",  # Allow unnecessary return statements (readability over conciseness)
    "TRY003",  # Allow specifying long messages outside the exception class
    "EM101",   # Allow exception string literals (simplifies standard ValueError usage)
    "EM102",   # Allow exception f-string literals (simplifies dynamic validation messages)
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Allow assert in tests
    "ANN",     # Allow missing type annotations in tests
    "ARG002",  # Allow unused fixture arguments (common in pytest)
    "RUF012",  # Allow mutable class-var defaults (test data)
    "C408",    # Allow dict() calls
    "PLR2004", # Allow magic values in assertions
    "PT006",   # Allow string-style parametrize args
    "S105",    # Allow password-like tokens in tests
    "S106",    # Allow hardcoded passwords in test factories
    "S107",    # Allow hardcoded passwords in test function defaults
]
"src/models/*.py" = [
    "I002",  # No forced `from __future__ import annotations` — breaks SQLModel Relationship()
    "UP037", # Keep quoted forward-ref annotations — needed for deferred SQLModel resolution
    "TC001", # Allow app imports outside TYPE_CHECKING — SQLModel needs them at runtime
    "TC003", # Allow stdlib imports outside TYPE_CHECKING — SQLAlchemy Mapped[] needs Decimal
]
"src/schemas/*.py" = [
    "TC001",   # Allow app imports outside TYPE_CHECKING — Pydantic needs them at runtime
    "TC003",   # Allow stdlib imports outside TYPE_CHECKING — Pydantic needs them at runtime
    "C901",    # Allow complex polymorphic validation dispatches (required for STI)
    "PLR0912", # Allow many branches for polymorphic validation (required for STI)
]
"src/crud/*.py" = [
    "A002",    # Allow shadowing 'id' builtin (required for generic PK fetching signatures)
    "ANN401",  # Allow 'Any' types (required for generic primary key arguments)
    "TC003",   # Allow stdlib imports outside TYPE_CHECKING (required for runtime UUID/Any resolution)
]
"src/routers/*.py" = [
    "TC001",   # Allow app imports outside TYPE_CHECKING — FastAPI needs them at runtime
    "TC002",   # Allow third-party imports outside TYPE_CHECKING — FastAPI needs them at runtime
    "TC003",   # Allow stdlib imports outside TYPE_CHECKING — FastAPI needs them at runtime
]
"alembic/**/*.py" = [
    "INP001",  # Alembic directories are not standard Python packages
    "ERA001",  # Allow commented-out main options in env.py
    "TC003",   # Allow stdlib imports in migration scripts
    "W291",    # Allow trailing whitespaces in migration metadata
]


[tool.ruff.lint.isort]
required-imports = [
    "from __future__ import annotations",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-v --strict-markers --tb=short"
