[project]
name = "kapital"
version = "0.1.0"
description = "Wealth management and analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.136.1",
    "marimo>=0.23.5",
    "polars>=1.40.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src",
]

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "D",       # Missing docstrings
    "E731",    # Allow lambda expressions (readability over function definitions)
    "PLR0913", # Allow functions with 5+ parameters
    "RET504",  # Allow unnecessary return statements (readability over conciseness)
]

[tool.ruff.lint.isort]
required-imports = [
    "from __future__ import annotations",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-v --strict-markers --tb=short"
